    currency: CNY
    customer_id: C-1001
    id: PAY-88100
    invoice_id: INV-2026-0101
    method: card
    paid_at: '2026-01-02T09:00:00'
    settled: 1
    status: succeeded
  - amount_cents: 4900
    currency: CNY
    customer_id: C-1001
    id: PAY-88212
    invoice_id: INV-2026-0142
    method: card
    paid_at: '2026-02-02T09:00:00'
    settled: 1
    status: succeeded
  - amount_cents: 4900
    currency: CNY
    customer_id: C-2002
    id: PAY-Z01
    invoice_id: INV-2026-Z01
    method: card
    paid_at: '2026-02-02T08:00:00'
    settled: 1
    status: succeeded
  - amount_cents: 4900
    currency: CNY
    customer_id: C-2002
    id: PAY-Z02
    invoice_id: INV-2026-Z01
    method: card
    paid_at: '2026-02-02T08:00:30'
    settled: 1
    status: succeeded
