# BillingOps 金种子 YAML 阅读示例：指定账单的正常重复扣费退款。
# 来源：data/tasks/gold-v1.json 中 gold-v1/D10-named-invoice/zh-1。
# 除字段顺序和这些中文注释外，所有值与源任务完全相同；本文件包含完整 world。
# 当前 load_tasks 只读取 JSON；本目录 refund-gold-001.json 是可直接读取的等价单题集合。
# YAML 顶层是单个 EvalTask 对象；JSON 顶层是包含该对象的列表。
# 工具权限与执行不变量由应用配置、服务端及通用评分器定义，不添加模板中的自创字段。
# 普通/重点风险试验次数由 suite 的 --trials / --key-risk-trials 设置，默认 3 / 7。
# 重点风险标签为 fault / approval / permission；本题仅标 write，因此默认每组运行 3 次。
# Agent 无直接 create_refund 工具：调查结束后由代码校验、人工审批和执行器完成退款。

# 任务身份与业务依据：相当于 case_id / capability_id / source / split。
task_id: gold-v1/D10-named-invoice/zh-1
dataset: gold-v1
family: gold-D10
mechanisms:
- D-10
spec_refs:
- 4.1#target-2
- 4.1#eligibility
business_line: duplicate
language: zh
disclosure: full
risk:
- write
capabilities:
- C1
- C2
- C4
- C7
- C9
mechanism_derivation: null

# 种子来源与变异：原始种子没有父题和变异算子。
lineage:
  mutation: null
  parent_task_id: null

# 用户输入：customer_id 来自服务端绑定；user_text 是首条原始消息。
customer_id: C-1001
user_text: 你好，我2月份的账单 INV-2026-0142 被扣了两次款，每次49元，麻烦把多扣的那笔退给我。

# 初始账务世界：完整保留原题七张表，包括干扰客户。金额单位均为分。
# Runner 每次试验先 load_world(world)。Agent 只能通过授权工具逐步读取。
