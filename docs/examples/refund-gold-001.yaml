    subscription_id: SUB-1
  - amount_cents: 4900
    currency: CNY
    customer_id: C-1001
    description: Pro plan, February 2026
    id: INV-2026-0142
    issued_at: '2026-02-01'
    period_end: '2026-02-28'
    period_start: '2026-02-01'
    status: paid
    subscription_id: SUB-1
  - amount_cents: 4900
    currency: CNY
    customer_id: C-2002
    description: ''
    id: INV-2026-Z01
    issued_at: '2026-02-01'
    period_end: '2026-02-28'
    period_start: '2026-02-01'
    status: paid
    subscription_id: null
  payments:
