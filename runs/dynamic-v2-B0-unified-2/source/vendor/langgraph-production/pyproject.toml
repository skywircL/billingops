[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-production"
version = "0.1.0"
description = "A LangGraph agent with the reliability layer around it: durable checkpoints, exactly-once side effects, single-use human approvals, and an evaluation harness that fails the build when routing regresses"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vinicius Pereira", email = "262471465+vinimabreu@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = [
    "langgraph",
    "agents",
    "human-in-the-loop",
    "checkpointing",
    "idempotency",
    "evaluation",
    "llm-reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "langchain-core>=0.3",
]

[project.scripts]
support-agent = "langgraph_production.__main__:main"
support-eval = "langgraph_production.evaluation.__main__:main"
support-reconcile = "langgraph_production.reconcile:main"

[project.urls]
Homepage = "https://github.com/vinimabreu/langgraph-production"
Issues = "https://github.com/vinimabreu/langgraph-production/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_production"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
