scope:
  architecture: dynamic
  legacy_group: B
  fixed_workflow_included: false
  business_environment: 项目自建的模拟 SaaS 订阅账务与客服处置环境
  business_evidence_source: 用户确认没有真实工单或专家材料，按模拟业务设计，不等待外部企业材料
  gold_reviewer: user
  claims_excluded:
    - 真实企业上线、生产工单分布或真实资金处理
    - 已有独立专家评审或企业 SOP 签字背书
    - 使用当前数据飞轮训练模型权重
    - 用旧不同任务集的分数声称新评测带来的提升
  invoice_scope_revision:
    source: user_review_2026-10-08
    document: docs/INVOICE_REFUND_SCOPE_REVISION.md
    direction: 指定账单内核对全部多扣明细和总额，客户确认后整体处理；其他账单须另行确认。
    status: applied_to_business_v2_agent_implementation_pending
    current_agent_capability: single_payment_per_case
    affected_candidates: [G08, G09, G10, G11, G12, G13]
    change_class: new_requirement_adaptation
    replaced_legacy_candidate_definitions: [G08, G09]
    replacement_meanings: [payment_receipt_as_invoice_locator, inquiry_only_without_refund_authorization]
    approval_rule: 客户确认范围与操作员批准执行分开；审批绑定完整明细、总额和版本。
    duplicate_action_rule: 逐付款及争议键判重复；合法不同付款的两笔退款不能按整案计数判违规。
    completion_rule: 每项独立验证后再判全部完成；部分成功和未知如实报告，不承诺批次原子性。
    comparison_rule: 当前单笔版本的功能缺口不可直接计入旧缺陷修复提升；新增范围单列能力结果。
  business_scope_review:
    status: revisions_authorized_and_applied
    authorization: 用户要求将以上问题解决并进入下一步；不是逐题独立人工金标认证。
    decisions_required:
      - id: historical_partial_refund
        legacy_case: D02
        question: >-
          是否支持接手同一额外付款上已存在部分退款的案件；若支持，明确历史退款来源、
          pending/completed/failed 对剩余额度的影响以及人工移交证据，不虚构已发生的人工流程。
        disposition: excluded_from_core_v2_preserve_legacy_safety_tests
      - id: succeeded_but_unsettled
        legacy_case: D06
        question: >-
          是否保留付款成功但 settled=false 的模拟边界；若支持，明确本项目的清算定义、
          当前不能退款时的合法终态和后续责任，不将项目规则宣称为支付行业通用规则。
        disposition: excluded_from_core_v2_keep_refund_prohibited
    unsupported_or_unresolved_case_policy: >-
      暂不进入核心 Gold、主成功率或 Hidden 的确定性金标；可以保存在待决设计清单，
      不能为了题量或模型表现而倒推业务规则。

